[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphonse-agent"
version = "2.0.0.dev0"
description = "Alphonse personal agent"
requires-python = ">=3.11"

[project.scripts]
alphonse = "alphonse.agent_v2.cli:main"

[tool.setuptools.packages.find]
include = ["alphonse*"]
