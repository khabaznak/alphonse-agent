[package]
name = "alphonse-desktop"
version = "0.1.0"
description = "Native desktop client for the Alphonse v2 daemon"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["io-util", "net", "time"] }
