[package]
name = "alphonse-desktop"
version = "0.1.0"
description = "Native desktop client for the Alphonse v2 daemon"
edition = "2021"

[features]
# This internal opt-in forces Tauri's embedded frontend protocol. It does not
# authenticate a person or establish that the installed binary is protected.
protected-owner = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["io-util", "net", "time", "sync"] }
